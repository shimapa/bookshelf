<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Книжная полка</title>
<link rel="stylesheet" href="app.css?v=13">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Книжная полка</h1>
    <span id="count" class="count"></span>
    <span id="syncState" class="count"></span>
  </div>
  <button id="menuBtn" class="icon-btn" aria-label="Меню"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/></svg></button>
  <div id="menu" class="menu" hidden>
    <button data-action="export">Скачать резервную копию</button>
    <button data-action="import" class="owner-only">Загрузить резервную копию</button>
    <button data-action="gkey" class="owner-only">Ключ Google Books API…</button>
    <button data-action="signin" class="visitor-only">Войти</button>
    <button data-action="signout" class="owner-only">Выйти</button>
    <span class="version">Версия 13</span>
  </div>
</header>

<div class="tools">
  <input id="search" type="search" placeholder="Поиск книг" autocomplete="off">
  <select id="sort" aria-label="Сортировка">
    <option value="added">Новые</option>
    <option value="title">По названию</option>
    <option value="author">По автору</option>
    <option value="rating">По оценке</option>
  </select>
</div>

<nav id="locations" class="locations" hidden></nav>
<datalist id="locationList"></datalist>

<main id="list" class="shelf"></main>

<div id="empty" class="empty" hidden>
  <p class="empty-title">Пока нет книг</p>
  <p class="empty-hint">Нажмите <b>Сканировать</b> и наведите камеру на штрихкод на обороте книги или введите название.</p>
</div>

<div class="bar owner-only">
  <form id="isbnForm" class="isbn-form">
    <input id="isbnInput" placeholder="ISBN или название" enterkeyhint="search" autocomplete="off">
    <button type="submit" class="btn">Добавить</button>
  </form>
  <button id="scanBtn" class="btn primary">Сканировать</button>
</div>

<!-- Camera scanner -->
<div id="scanner" class="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div id="scanModes" class="scan-modes">
    <button type="button" data-mode="barcode">Штрихкод</button>
    <button type="button" data-mode="text">Номер ISBN</button>
  </div>
  <div class="frame"></div>
  <p id="scanHint" class="scan-hint">Наведите на штрихкод</p>
  <button id="closeScan" class="btn close-scan">Закрыть</button>
</div>

<!-- Book sheet: confirm new / edit existing -->
<div id="sheet" class="sheet-wrap" hidden>
  <form id="bookForm" class="sheet">
    <div class="sheet-head">
      <span id="fCover" class="cover"></span>
      <div>
        <p id="sheetNote" class="note"></p>
        <p class="isbn-line">ISBN <span id="fIsbnText"></span></p>
        <p id="sheetDetail" class="isbn-line" hidden></p>
        <a id="grLink" class="isbn-line gr-link" target="_blank" rel="noopener" hidden></a>
      </div>
    </div>
    <label>Название <input name="title" required></label>
    <label>Автор <input name="authors"></label>
    <div class="row">
      <label>Издательство <input name="publisher"></label>
      <label class="short">Год <input name="year" inputmode="numeric"></label>
    </div>
    <label>Место <input name="location" list="locationList" placeholder="например, Гостиная, полка 2" autocomplete="off"></label>
    <label>Заметки <textarea name="notes" rows="2" placeholder="Состояние, кому дал почитать…"></textarea></label>
    <div class="sheet-actions">
      <button type="button" id="deleteBtn" class="btn danger owner-only" hidden>Удалить</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn" class="btn">Отмена</button>
      <button type="submit" id="saveBtn" class="btn primary owner-only">Добавить</button>
    </div>
    <button type="submit" id="saveNextBtn" class="btn wide owner-only" value="next">Добавить и сканировать дальше</button>
  </form>
</div>

<!-- Title search results -->
<div id="results" class="sheet-wrap" hidden>
  <div class="sheet">
    <p class="note">Поиск: <span id="resultsTitle"></span></p>
    <div id="resultsList" class="results"></div>
    <div class="sheet-actions">
      <button type="button" id="manualBtn" class="btn">Добавить вручную</button>
      <span class="spacer"></span>
      <button type="button" id="resultsClose" class="btn">Закрыть</button>
    </div>
  </div>
</div>

<!-- Sign in: only the owner can change the library -->
<div id="signin" class="sheet-wrap" hidden>
  <form id="signinForm" class="sheet">
    <p class="note">Вход для редактирования</p>
    <p class="isbn-line">Вставьте GitHub-токен с правом записи в <b>shimapa/bookshelf</b>. Он хранится только на этом устройстве.</p>
    <input name="username" autocomplete="username" value="shimapa" hidden>
    <label>GitHub-токен <input name="token" type="password" autocomplete="current-password" required></label>
    <p id="signinError" class="note warn" hidden></p>
    <div class="sheet-actions">
      <span class="spacer"></span>
      <button type="button" id="signinCancel" class="btn">Отмена</button>
      <button type="submit" class="btn primary">Войти</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
<input id="importFile" type="file" accept="application/json" hidden>

<script src="app.js?v=13"></script>
</body>
</html>
