<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Bookshelf</title>
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Bookshelf</h1>
    <span id="count" class="count"></span>
    <span id="syncState" class="count"></span>
  </div>
  <button id="menuBtn" class="icon-btn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/></svg></button>
  <div id="menu" class="menu" hidden>
    <button data-action="export">Export backup</button>
    <button data-action="import" class="owner-only">Import backup</button>
    <button data-action="gkey" class="owner-only">Google Books API key…</button>
    <button data-action="signin" class="visitor-only">Sign in</button>
    <button data-action="signout" class="owner-only">Sign out</button>
    <span class="version">Version 11</span>
  </div>
</header>

<div class="tools">
  <input id="search" type="search" placeholder="Search books" autocomplete="off">
  <select id="sort" aria-label="Sort">
    <option value="added">Recently added</option>
    <option value="title">Title</option>
    <option value="author">Author</option>
    <option value="rating">Rating</option>
  </select>
</div>

<nav id="locations" class="locations" hidden></nav>
<datalist id="locationList"></datalist>

<main id="list" class="shelf"></main>

<div id="empty" class="empty" hidden>
  <p class="empty-title">No books yet</p>
  <p class="empty-hint">Tap <b>Scan</b> and point the camera at the barcode on the back cover.</p>
</div>

<div class="bar owner-only">
  <form id="isbnForm" class="isbn-form">
    <input id="isbnInput" inputmode="numeric" placeholder="Type or scan ISBN" autocomplete="off">
    <button type="submit" class="btn">Add</button>
  </form>
  <button id="scanBtn" class="btn primary">Scan</button>
</div>

<!-- Camera scanner -->
<div id="scanner" class="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div id="scanModes" class="scan-modes">
    <button type="button" data-mode="barcode">Barcode</button>
    <button type="button" data-mode="text">ISBN text</button>
  </div>
  <div class="frame"></div>
  <p id="scanHint" class="scan-hint">Point at the barcode</p>
  <button id="closeScan" class="btn close-scan">Close</button>
</div>

<!-- Book sheet: confirm new / edit existing -->
<div id="sheet" class="sheet-wrap" hidden>
  <form id="bookForm" class="sheet">
    <div class="sheet-head">
      <span id="fCover" class="cover"></span>
      <div>
        <p id="sheetNote" class="note"></p>
        <p class="isbn-line">ISBN <span id="fIsbnText"></span></p>
        <p id="sheetDetail" class="isbn-line" hidden></p>
        <a id="grLink" class="isbn-line gr-link" target="_blank" rel="noopener" hidden></a>
      </div>
    </div>
    <label>Title <input name="title" required></label>
    <label>Author <input name="authors"></label>
    <div class="row">
      <label>Publisher <input name="publisher"></label>
      <label class="short">Year <input name="year" inputmode="numeric"></label>
    </div>
    <label>Location <input name="location" list="locationList" placeholder="e.g. Living room, shelf 2" autocomplete="off"></label>
    <label>Notes <textarea name="notes" rows="2" placeholder="Condition, lent to…"></textarea></label>
    <div class="sheet-actions">
      <button type="button" id="deleteBtn" class="btn danger owner-only" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn" class="btn">Cancel</button>
      <button type="submit" id="saveBtn" class="btn primary owner-only">Add book</button>
    </div>
    <button type="submit" id="saveNextBtn" class="btn wide owner-only" value="next">Add &amp; scan next</button>
  </form>
</div>

<!-- Sign in: only the owner can change the library -->
<div id="signin" class="sheet-wrap" hidden>
  <form id="signinForm" class="sheet">
    <p class="note">Sign in to edit</p>
    <p class="isbn-line">Paste a GitHub token that can write to <b>shimapa/bookshelf</b>. It is kept only on this device.</p>
    <input name="username" autocomplete="username" value="shimapa" hidden>
    <label>GitHub token <input name="token" type="password" autocomplete="current-password" required></label>
    <p id="signinError" class="note warn" hidden></p>
    <div class="sheet-actions">
      <span class="spacer"></span>
      <button type="button" id="signinCancel" class="btn">Cancel</button>
      <button type="submit" class="btn primary">Sign in</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
<input id="importFile" type="file" accept="application/json" hidden>

<script src="app.js?v=11"></script>
</body>
</html>
